{% extends "base.html" %}
{% block title %}{{ c('account.heading') }} · {{ c('site.name') }}{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto">
  <div class="mb-6">
    <p class="font-mono text-xs uppercase tracking-widest text-amber-dark mb-1">{{ user.username }} · {{ user.role | capitalize }}</p>
    <h1 class="font-display text-3xl text-ink">{{ c('account.heading') }}</h1>
  </div>

  <div class="bg-parchment-dim border border-parchment-line rounded-lg p-6">
    <form method="POST">
      <label class="block font-mono text-xs uppercase tracking-wide text-ink-faint mb-1">{{ c('account.current_password_label') }}</label>
      <input type="password" name="current_password" autocomplete="current-password" class="w-full mb-4 px-3 py-2 rounded-md border border-parchment-line bg-parchment focus:outline-none focus:ring-2 focus:ring-amber">

      <label class="block font-mono text-xs uppercase tracking-wide text-ink-faint mb-1">{{ c('account.new_password_label') }}</label>
      <input type="password" name="new_password" autocomplete="new-password" class="w-full mb-4 px-3 py-2 rounded-md border border-parchment-line bg-parchment focus:outline-none focus:ring-2 focus:ring-amber">

      <label class="block font-mono text-xs uppercase tracking-wide text-ink-faint mb-1">{{ c('account.confirm_password_label') }}</label>
      <input type="password" name="confirm_password" autocomplete="new-password" class="w-full mb-6 px-3 py-2 rounded-md border border-parchment-line bg-parchment focus:outline-none focus:ring-2 focus:ring-amber">

      <button type="submit" class="w-full bg-amber hover:bg-amber-dark text-ink font-semibold font-mono text-sm uppercase tracking-wide px-4 py-3 rounded-md">
        {{ c('account.submit_btn') }}
      </button>
    </form>
  </div>
</div>
{% endblock %}
