{% extends "base.html" %}
{% block title %}{{ c('login.heading') }} · {{ c('site.name') }}{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-10">
  <div class="bg-parchment-dim border border-parchment-line rounded-lg p-8">
    <h1 class="font-display text-3xl text-ink mb-1 text-center">{{ c('login.heading') }}</h1>
    <p class="font-body text-sm text-ink-faint mb-6 text-center">{{ c('login.subheading') }}</p>

    <form method="POST">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label class="block font-mono text-xs uppercase tracking-wide text-ink-faint mb-1">{{ c('login.username_label') }}</label>
      <input name="username" autofocus autocapitalize="off" autocomplete="username" class="w-full mb-4 px-3 py-2 rounded-md border border-parchment-line bg-parchment focus:outline-none focus:ring-2 focus:ring-amber">

      <label class="block font-mono text-xs uppercase tracking-wide text-ink-faint mb-1">{{ c('login.password_label') }}</label>
      <input type="password" name="password" autocomplete="current-password" class="w-full mb-6 px-3 py-2 rounded-md border border-parchment-line bg-parchment focus:outline-none focus:ring-2 focus:ring-amber">

      <button type="submit" class="w-full bg-amber hover:bg-amber-dark text-ink font-semibold font-mono text-sm uppercase tracking-wide px-4 py-3 rounded-md">
        {{ c('login.submit_btn') }}
      </button>
    </form>
  </div>
  <p class="text-center font-mono text-[11px] text-ink-faint uppercase tracking-wide mt-4">
    First time? Default login is admin / admin — change it after signing in.
  </p>
</div>
{% endblock %}
