<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Logicore Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 2.25rem;
      background: var(--bg-50);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }
    .login-brand img { width: 34px; height: 34px; }
    .login-brand-word {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
    }
    .login-brand-sub {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 0.625rem 0.75rem;
      margin-bottom: 1.1rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.9rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button[type="submit"] {
      width: 100%;
      padding: 0.7rem;
      background: var(--accent);
      color: #06110d;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: var(--accent-glow); }
    .flash {
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.1rem;
    }
    .flash-error { background: rgba(239,68,68,.12); color: #f87171; border: 1px solid rgba(239,68,68,.3); }
    .flash-success { background: rgba(47,216,166,.12); color: var(--accent-glow); border: 1px solid rgba(47,216,166,.3); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <img src="/static/logicore_mark.png" alt="Logicore" />
      <div>
        <div class="login-brand-word">LOGICORE</div>
        <div class="login-brand-sub">Portal</div>
      </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {% if category == 'error' %}flash-error{% else %}flash-success{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autofocus required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
