name: Apply PR 1 stabilization patch

on:
  push:
    branches:
      - fix/billing-and-access-control
    paths:
      - .github/patches/pr1.patch
      - .github/workflows/apply-pr1.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/billing-and-access-control
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply patch
        run: |
          git apply --check --recount .github/patches/pr1.patch
          git apply --recount .github/patches/pr1.patch

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile and test
        run: |
          python -m compileall -q .
          pytest -q

      - name: Commit stabilized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/patches/pr1.patch .github/workflows/apply-pr1.yml
          git add -A
          git commit -m "Fix billing and output access controls"
          git push origin HEAD:fix/billing-and-access-control
