name: Apply PR 1 stabilization changes

on:
  push:
    branches:
      - fix/billing-and-access-control
    paths:
      - .github/scripts/apply_pr1.py
      - .github/workflows/apply-pr1.yml
      - tests/test_billing_and_access_control.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v4
        with:
          ref: fix/billing-and-access-control
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tighten updater match
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_pr1.py')
          text = path.read_text(encoding='utf-8')
          old = '''    text = replace_once(
                  text,
                  ''' + "'''" + '''                     small_parts_df, unit_picks_count, small_part_picks,
                               part_type_totals, line_prices, part_prices)''' + "'''" + ''',
                  ''' + "'''" + '''                     small_parts_df, unit_picks_count, small_part_picks,
                               line_prices)''' + "'''" + ''',
                  "storage breakdown call",
              )'''
          new = '''    text = replace_once(
                  text,
                  ''' + "'''" + '''    _build_breakdown(wb, invoice_date, completed_date, call_id, customer,
                               unit_storage_df, pallet_count, units_received,
                               small_parts_df, unit_picks_count, small_part_picks,
                               part_type_totals, line_prices, part_prices)''' + "'''" + ''',
                  ''' + "'''" + '''    _build_breakdown(wb, invoice_date, completed_date, call_id, customer,
                               unit_storage_df, pallet_count, units_received,
                               small_parts_df, unit_picks_count, small_part_picks,
                               line_prices)''' + "'''" + ''',
                  "storage breakdown call",
              )'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one updater block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply deterministic source updates
        run: python .github/scripts/apply_pr1.py

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile changed Python
        run: python -m compileall -q app.py storage_builder.py tests

      - name: Run regression suite
        run: pytest -v

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py storage_builder.py tests
          git rm -f .github/patches/pr1.patch
          git rm -f .github/scripts/apply_pr1.py
          git rm -f .github/workflows/apply-pr1.yml
          git commit -m "Fix billing calculations and output access control"
          git push origin HEAD:fix/billing-and-access-control
